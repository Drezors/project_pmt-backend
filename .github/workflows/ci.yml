name: CI/CD Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn clean install

#      - name: Run tests
#        run: mvn test

#      - name: Generate coverage report
#        run: mvn jacoco:report

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: target/site/jacoco

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: docker build -t project_pmt-backend:latest .

      - name: Tag and push Docker image
        run: |
          docker tag project_pmt-backend:latest ${{ secrets.DOCKER_HUB_USERNAME }}/project_pmt-backend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/project_pmt-backend:latest
